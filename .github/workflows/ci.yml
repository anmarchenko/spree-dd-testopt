name: CI

on:
  push:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-test-runner
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  RAILS_ENV: test
  DD_TRACE_DEBUG: 0
  DD_ENV: ci
  DD_SERVICE: spree
  DD_TEST_OPTIMIZATION_RUNNER_PLATFORM: ruby
  DD_TEST_OPTIMIZATION_RUNNER_FRAMEWORK: rspec
  DD_TEST_OPTIMIZATION_RUNNER_MIN_PARALLELISM: 1
  DD_TEST_OPTIMIZATION_RUNNER_MAX_PARALLELISM: 8
  DD_TEST_OPTIMIZATION_RUNNER_TEST_DISCOVERY_CACHE: .ddtest-cache/tests-discovery.json
  DD_TEST_OPTIMIZATION_RUNNER_TESTS_EXCLUDE_PATTERN: spec/ddtest/excluded/**/*_spec.rb

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.dd_plan.outputs.matrix }}

    steps:
      - uses: actions/checkout@v4
        with:
          # DDTest discovery cache validation needs the cache source commit locally.
          fetch-depth: 3
      - name: Restore DDTest discovery cache
        id: ddtest_discovery_cache
        uses: actions/cache/restore@v4
        with:
          path: core/.ddtest-cache/tests-discovery.json
          key: ddtest-discovery-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ddtest-discovery-${{ runner.os }}-${{ github.ref_name }}-
            ddtest-discovery-${{ runner.os }}-
            ddtest-discovery-
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false
      # ddtest's platform sanity check runs `bundle info datadog-ci`, which
      # fails unless the gem is in the resolved bundle. Mirror what crook
      # does locally and inject it before bundling.
      - name: Inject datadog-ci into shared dependencies
        run: |
          printf "\ngroup :test do\n  gem 'datadog-ci'\nend\n" >> common_spree_dependencies.rb
      - name: Bundle install (root)
        run: bundle install
      - name: Bundle install (core)
        working-directory: core
        run: bundle install
      - name: Generate test app for core
        working-directory: core
        run: bundle exec rake test_app
      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: ruby
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.eu
      - name: Download ddtest binary
        run: |
          LATEST_PRERELEASE_TAG=$(gh release list --repo DataDog/ddtest --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' | head -n 1)
          gh release download "$LATEST_PRERELEASE_TAG" --repo DataDog/ddtest --pattern "ddtest-linux-amd64" --dir bin
          mv bin/ddtest-linux-amd64 bin/ddtest
          chmod +x bin/ddtest
        env:
          GH_TOKEN: ${{ github.token }}
      - id: dd_plan
        name: Setup Datadog Test Runner
        working-directory: core
        run: ../bin/ddtest plan
      - name: Verify DDTest exclude pattern
        run: |
          test -f core/.testoptimization/runner/test-files.txt
          test -d core/.testoptimization/runner/tests-split
          if grep -Fq "spec/ddtest/excluded/exclude_pattern_canary_spec.rb" core/.testoptimization/runner/test-files.txt core/.testoptimization/runner/tests-split/runner-*; then
            echo "DDTest exclude pattern did not filter the canary spec" >&2
            exit 1
          fi
      - id: stage_ddtest_discovery_cache
        name: Stage latest DDTest discovery cache
        if: always()
        run: |
          if [ -f core/.testoptimization/tests-discovery/tests.json ]; then
            mkdir -p core/.ddtest-cache
            cp core/.testoptimization/tests-discovery/tests.json core/.ddtest-cache/tests-discovery.json
            echo "cache-ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache-ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save latest DDTest discovery cache
        if: always() && steps.stage_ddtest_discovery_cache.outputs.cache-ready == 'true' && steps.ddtest_discovery_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: core/.ddtest-cache/tests-discovery.json
          key: ${{ steps.ddtest_discovery_cache.outputs.cache-primary-key }}
      - name: Upload DD artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dd-artifacts
          path: 'core/.testoptimization'
          if-no-files-found: warn
          include-hidden-files: true
      - name: Upload core dummy app
        uses: actions/upload-artifact@v4
        with:
          name: core-dummy-app
          path: core/spec/dummy
          if-no-files-found: error
          include-hidden-files: true

  rspec:
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    env:
      DD_TEST_OPTIMIZATION_RUNNER_CI_NODE: ${{ matrix.ci_node_index }}
      DD_TEST_OPTIMIZATION_RUNNER_WORKER_ENV: DB_SUFFIX=_worker{{nodeIndex}}

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libvips
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false
      - name: Inject datadog-ci into shared dependencies
        run: |
          printf "\ngroup :test do\n  gem 'datadog-ci'\nend\n" >> common_spree_dependencies.rb
      - name: Bundle install (core)
        working-directory: core
        run: bundle install
      - name: Download DD artifacts
        uses: actions/download-artifact@v4
        with:
          name: dd-artifacts
          path: 'core/.testoptimization'
      - name: Download core dummy app
        uses: actions/download-artifact@v4
        with:
          name: core-dummy-app
          path: core/spec/dummy
      - name: Prepare per-node test database
        # mkdir -p tmp: actions/upload-artifact skips empty dirs, but specs
        # like export_spec write CSVs to Rails.root.join('tmp').
        run: |
          cp core/spec/dummy/db/spree_test.sqlite3 core/spec/dummy/db/spree_test_worker${DD_TEST_OPTIMIZATION_RUNNER_CI_NODE}.sqlite3
          mkdir -p core/spec/dummy/tmp
      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@v2
        with:
          languages: ruby
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.eu
      - name: Download ddtest binary
        run: |
          LATEST_PRERELEASE_TAG=$(gh release list --repo DataDog/ddtest --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' | head -n 1)
          gh release download "$LATEST_PRERELEASE_TAG" --repo DataDog/ddtest --pattern "ddtest-linux-amd64" --dir bin
          mv bin/ddtest-linux-amd64 bin/ddtest
          chmod +x bin/ddtest
        env:
          GH_TOKEN: ${{ github.token }}
      - name: RSpec
        working-directory: core
        run: ../bin/ddtest run
